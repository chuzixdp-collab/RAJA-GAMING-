# ============================================================
# Netlify build configuration
#
# Migration safety model (schema.prisma defines `directUrl = env("DIRECT_DATABASE_URL")`,
# so ALL `prisma migrate` commands connect via DIRECT_DATABASE_URL):
#
# - Deploy previews / branch deploys: migrations are FIRST verified against
#   an EPHEMERAL Postgres created and destroyed inside the build container
#   (scripts/ci-migrate-isolated.mjs — that step never touches any
#   environment-configured database). Then the SAME hardened runner used by
#   production (scripts/migrate-deploy.mjs, gated behind the explicit
#   ALLOW_PREVIEW_MIGRATION=1 opt-in) applies any pending additive-only
#   migrations to the preview's runtime database, which today is the
#   production-configured Neon database shared with the deployed site. This
#   is required because a deploy preview runs code generated from THIS
#   branch's Prisma schema: without it, any page querying a model that this
#   branch's migration extends fails at runtime (e.g. P2022 "column does not
#   exist"). The runner is transactional, additive-only, idempotent and
#   fail-closed, so the production site's behavior is unaffected (old code
#   ignores new nullable columns/tables), and the merge-time production
#   migration becomes a no-op. A TCP reachability probe for the migration
#   target is logged, and a booleans-only summary is published at
#   /db-check.json.
#
# - Production: scripts/migrate-deploy.mjs applies pending migrations via
#   node-postgres against DIRECT_DATABASE_URL (schema.prisma directUrl). The
#   ledger (_prisma_migrations) stays Prisma-CLI-compatible, every migration
#   is transactional and additive-only, and any failure fails the build so a
#   broken deploy can never reach production. The native-engine
#   `prisma migrate deploy` is NOT used because that engine cannot negotiate
#   with the Neon proxy (see scripts/migrate-deploy.mjs and src/lib/db.ts).
#   ci-db-check.mjs logs TCP reachability of the migration target BEFORE
#   migrating to make connection failures diagnosable from the build log.
# ============================================================

[build]
  # Default command — used by deploy previews and branch deploys.
  # Order matters: ci-db-check.mjs writes public/db-check.json BEFORE
  # `next build` so the Next.js runtime can serve it on the preview site.
  command = "node scripts/ci-db-check.mjs --write-json && node scripts/ci-migrate-isolated.mjs && ALLOW_PREVIEW_MIGRATION=1 node scripts/migrate-deploy.mjs && npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[context.deploy-preview]
  command = "node scripts/ci-db-check.mjs --write-json && node scripts/ci-migrate-isolated.mjs && ALLOW_PREVIEW_MIGRATION=1 node scripts/migrate-deploy.mjs && npx prisma generate && npm run build"

[context.branch-deploy]
  command = "node scripts/ci-db-check.mjs --write-json && node scripts/ci-migrate-isolated.mjs && ALLOW_PREVIEW_MIGRATION=1 node scripts/migrate-deploy.mjs && npx prisma generate && npm run build"

# - Production command sequence (order matters):
#     1. ci-db-check.mjs   — read-only TCP reachability probe of BOTH
#                            DIRECT_DATABASE_URL and DATABASE_URL, logged before
#                            anything else so connection failures are diagnosable.
#     2. prisma generate   — Prisma Client from this tree's schema.prisma.
#     3. migrate-deploy.mjs — the hardened runner applies pending migrations via
#                            node-postgres against DIRECT_DATABASE_URL. Netlify
#                            sets CONTEXT=production for production builds, which
#                            is what the runner's fail-closed context guard reads.
#     4. npm run build     — Next.js production build (runs against the migrated
#                            schema).
#     5. ci-db-check.mjs --write-json — final reachability check.
#   The runner keeps the `_prisma_migrations` ledger Prisma-CLI-compatible, is
#   transactional, additive-only, idempotent, and baselines safely if the
#   database was created outside of migrations. Any failure fails the build, so
#   a broken deploy can never reach production. (The native-engine
#   `prisma migrate deploy` is NOT used because that engine cannot negotiate
#   with the Neon proxy — see scripts/migrate-deploy.mjs and src/lib/db.ts.)
[context.production]
  command = "node scripts/ci-db-check.mjs && npx prisma generate && node scripts/migrate-deploy.mjs && npm run build && node scripts/ci-db-check.mjs --write-json"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
